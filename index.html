<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roulette</title>
    <style>
        body {
            font-family: sans-serif;
            background-color: #ffffff;
            color: #000000;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            height: 100vh;
            box-sizing: border-box;
        }
        .container {
            display: flex;
            gap: 40px;
            max-width: 1200px;
            width: 100%;
        }
        .left-panel, .right-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .wheel-box {
            position: relative;
            width: 400px;
            height: 400px;
            margin-bottom: 20px;
        }
        #wheel {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            transition: transform 5s cubic-bezier(0.25, 0.1, 0.2, 1);
        }
        #ball-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            transition: transform 5s cubic-bezier(0.25, 0.1, 0.2, 1);
        }
        #ball {
            position: absolute;
            top: 15px; /* 바깥 트랙 위치 */
            left: 50%;
            transform: translateX(-50%);
            width: 14px;
            height: 14px;
            background-color: #ffffff;
            border-radius: 50%;
            box-shadow: 0 0 5px rgba(0,0,0,0.6);
        }
        button {
            padding: 12px 50px;
            font-size: 18px;
            background-color: #333;
            color: #fff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover { background-color: #555; }
        button:disabled { background-color: #999; cursor: not-allowed; }
        
        .info-box {
            margin-top: 20px;
            width: 100%;
            background: #f0f0f0;
            padding: 15px;
            border-radius: 5px;
            text-align: center;
            border: 1px solid #ddd;
        }
        
        /* 족보 (배팅 보드) 스타일 */
        .board {
            display: grid;
            grid-template-columns: 50px repeat(12, 1fr) 60px;
            grid-template-rows: repeat(5, 45px);
            gap: 2px;
            width: 100%;
            background: #ccc;
            border: 2px solid #ccc;
        }
        .cell {
            background: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            user-select: none;
            box-sizing: border-box;
        }
        .cell:hover { opacity: 0.85; }
        .cell.selected {
            box-shadow: inset 0 0 0 4px #0055ff;
            z-index: 2;
        }
        
        /* 색상 클래스 */
        .red { background-color: #d90000; color: white; }
        .black { background-color: #222222; color: white; }
        .green { background-color: #008000; color: white; }
        .special { background-color: #eaeaea; color: #333; }
    </style>
</head>
<body>

<div class="container">
    <!-- 왼쪽: 룰렛 화면 -->
    <div class="left-panel">
        <div class="wheel-box">
            <canvas id="wheel" width="400" height="400"></canvas>
            <div id="ball-container">
                <div id="ball"></div>
            </div>
        </div>
        <button id="spin-btn">스핀</button>
        
        <div class="info-box">
            <h3 style="margin:0 0 10px 0;">결과</h3>
            <div id="result-display" style="font-size: 24px; font-weight: bold;">-</div>
        </div>
    </div>

    <!-- 오른쪽: 족보 화면 -->
    <div class="right-panel">
        <div class="board" id="board">
            <!-- 자바스크립트로 족보 생성 -->
        </div>

        <div class="info-box">
            <h3 style="margin:0 0 10px 0;">맞춘 배팅</h3>
            <div id="win-display" style="font-weight: bold;">-</div>
        </div>
    </div>
</div>

<script>
    const sequence = [0, 32, 15, 19, 4, 21, 2, 25, 17, 34, 6, 27, 13, 36, 11, 30, 8, 23, 10, 5, 24, 16, 33, 1, 20, 14, 31, 9, 22, 18, 29, 7, 28, 12, 35, 3, 26];
    const redNumbers = [1, 3, 5, 7, 9, 12, 14, 16, 18, 19, 21, 23, 25, 27, 30, 32, 34, 36];
    
    let selectedBets = new Set();
    let totalWheelRotation = 0;
    let isSpinning = false;

    // 1. 배팅 보드 생성
    function initBoard() {
        const board = document.getElementById('board');
        
        function createCell(text, betValue, gridArea, colorClass) {
            const cell = document.createElement('div');
            cell.className = `cell ${colorClass}`;
            cell.style.gridArea = gridArea;
            cell.textContent = text;
            cell.dataset.bet = betValue;
            cell.addEventListener('click', toggleBet);
            board.appendChild(cell);
        }

        // 0 구역 (왼쪽 합치기)
        createCell('0', '0', '1 / 1 / 4 / 2', 'green');

        // 1~36 숫자 구역
        const rows = [
            [3,6,9,12,15,18,21,24,27,30,33,36],
            [2,5,8,11,14,17,20,23,26,29,32,35],
            [1,4,7,10,13,16,19,22,25,28,31,34]
        ];
        rows.forEach((row, rowIndex) => {
            row.forEach((num, colIndex) => {
                const color = redNumbers.includes(num) ? 'red' : 'black';
                createCell(num, num.toString(), `${rowIndex + 1} / ${colIndex + 2} / ${rowIndex + 2} / ${colIndex + 3}`, color);
            });
        });

        // 2 to 1 (오른쪽 Columns)
        createCell('2 to 1', 'col3', '1 / 14 / 2 / 15', 'special'); // 3, 6, 9...
        createCell('2 to 1', 'col2', '2 / 14 / 3 / 15', 'special'); // 2, 5, 8...
        createCell('2 to 1', 'col1', '3 / 14 / 4 / 15', 'special'); // 1, 4, 7...

        // Dozens (1~12, 13~24, 25~36)
        createCell('1st 12', '1st12', '4 / 2 / 5 / 6', 'special');
        createCell('2nd 12', '2nd12', '4 / 6 / 5 / 10', 'special');
        createCell('3rd 12', '3rd12', '4 / 10 / 5 / 14', 'special');

        // 하단 배팅
        createCell('1 to 18', '1-18', '5 / 2 / 6 / 4', 'special');
        createCell('Even', 'even', '5 / 4 / 6 / 6', 'special');
        createCell('Red', 'red', '5 / 6 / 6 / 8', 'red');
        createCell('Black', 'black', '5 / 8 / 6 / 10', 'black');
        createCell('Odd', 'odd', '5 / 10 / 6 / 12', 'special');
        createCell('19 to 36', '19-36', '5 / 12 / 6 / 14', 'special');
    }

    // 2. 배팅 선택 로직
    function toggleBet(e) {
        if (isSpinning) return;
        const cell = e.target;
        const betValue = cell.dataset.bet;

        if (selectedBets.has(betValue)) {
            selectedBets.delete(betValue);
            cell.classList.remove('selected');
        } else {
            selectedBets.add(betValue);
            cell.classList.add('selected');
        }
    }

    // 3. 룰렛 휠 디자인 그리기
    function drawWheel() {
        const canvas = document.getElementById('wheel');
        const ctx = canvas.getContext('2d');
        const center = canvas.width / 2;
        const arc = 2 * Math.PI / sequence.length;

        ctx.translate(center, center);

        // 바깥 공 굴러가는 트랙 (회색)
        ctx.beginPath();
        ctx.arc(0, 0, 195, 0, Math.PI * 2);
        ctx.fillStyle = '#e0e0e0';
        ctx.fill();
        ctx.lineWidth = 10;
        ctx.strokeStyle = '#cccccc';
        ctx.stroke();

        // 룰렛 칸 그리기
        for (let i = 0; i < sequence.length; i++) {
            const num = sequence[i];
            const angle = i * arc;
            
            if (num === 0) ctx.fillStyle = '#008000';
            else if (redNumbers.includes(num)) ctx.fillStyle = '#d90000';
            else ctx.fillStyle = '#222222';

            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.arc(0, 0, 170, angle - arc/2 - Math.PI/2, angle + arc/2 - Math.PI/2);
            ctx.fill();

            // 숫자 텍스트
            ctx.save();
            ctx.fillStyle = "white";
            ctx.font = "bold 16px sans-serif";
            ctx.rotate(angle - Math.PI/2);
            ctx.textAlign = "right";
            ctx.fillText(num, 155, 6);
            ctx.restore();
        }

        // 중앙 기둥 장식
        ctx.beginPath();
        ctx.arc(0, 0, 70, 0, Math.PI * 2);
        ctx.fillStyle = '#dddddd';
        ctx.fill();
        ctx.lineWidth = 5;
        ctx.strokeStyle = '#aaaaaa';
        ctx.stroke();
    }

    // 4. 스핀 및 공 굴리기 로직
    document.getElementById('spin-btn').addEventListener('click', () => {
        if (isSpinning) return;
        isSpinning = true;
        document.getElementById('spin-btn').disabled = true;
        document.getElementById('result-display').textContent = '회전 중...';
        document.getElementById('win-display').textContent = '-';
        document.getElementById('win-display').style.color = '#000';

        const wheel = document.getElementById('wheel');
        const ballContainer = document.getElementById('ball-container');
        const ball = document.getElementById('ball');

        // 공 위치 초기화 (바깥 트랙)
        ball.style.transition = 'none';
        ball.style.top = '15px'; 
        ball.offsetHeight; // Reflow 강제 실행

        // 당첨 결과 계산
        const winIndex = Math.floor(Math.random() * sequence.length);
        const winNumber = sequence[winIndex];
        
        // 휠은 시계 방향으로 5바퀴 + 랜덤 회전
        const spinDegree = (360 * 5) + Math.floor(Math.random() * 360);
        totalWheelRotation += spinDegree;
        
        // 공은 휠과 반대로 회전하며 정확한 당첨 칸에 안착하도록 각도 계산
        const pocketAngle = winIndex * (360 / sequence.length);
        // 휠의 최종 각도에 당첨 칸의 각도를 더한 후, 반대 방향으로 여러 바퀴(-360 * 8) 돌게 설정
        const finalBallRotation = totalWheelRotation + pocketAngle - (360 * 8);

        // 애니메이션 시작
        wheel.style.transform = `rotate(${totalWheelRotation}deg)`;
        ballContainer.style.transform = `rotate(${finalBallRotation}deg)`;
        
        // 공이 안쪽 홈으로 떨어지는 애니메이션 (스핀이 끝나기 1.5초 전에 실행)
        setTimeout(() => {
            ball.style.transition = 'top 1.5s cubic-bezier(0.2, 0.8, 0.4, 1)';
            ball.style.top = '55px'; // 당첨 숫자 칸 반경으로 이동
        }, 3500);

        // 최종 결과 출력
        setTimeout(() => {
            checkResult(winNumber);
            isSpinning = false;
            document.getElementById('spin-btn').disabled = false;
        }, 5000);
    });

    // 5. 결과 판독
    function checkResult(winNumber) {
        const isRed = redNumbers.includes(winNumber);
        const colorText = winNumber === 0 ? "Green" : (isRed ? "Red" : "Black");
        
        document.getElementById('result-display').textContent = `${winNumber} (${colorText})`;
        
        let matched = [];
        
        selectedBets.forEach(bet => {
            // 단일 숫자
            if (!isNaN(bet) && parseInt(bet) === winNumber) {
                matched.push(`숫자 ${bet}`);
            } 
            // 0이 아닐 때만 적용되는 외부 배팅
            else if (winNumber !== 0) {
                if (bet === 'red' && isRed) matched.push("Red");
                if (bet === 'black' && !isRed) matched.push("Black");
                if (bet === 'even' && winNumber % 2 === 0) matched.push("Even");
                if (bet === 'odd' && winNumber % 2 !== 0) matched.push("Odd");
                if (bet === '1-18' && winNumber >= 1 && winNumber <= 18) matched.push("1 to 18");
                if (bet === '19-36' && winNumber >= 19 && winNumber <= 36) matched.push("19 to 36");
                if (bet === '1st12' && winNumber >= 1 && winNumber <= 12) matched.push("1st 12");
                if (bet === '2nd12' && winNumber >= 13 && winNumber <= 24) matched.push("2nd 12");
                if (bet === '3rd12' && winNumber >= 25 && winNumber <= 36) matched.push("3rd 12");
                if (bet === 'col1' && winNumber % 3 === 1) matched.push("2 to 1 (하단)");
                if (bet === 'col2' && winNumber % 3 === 2) matched.push("2 to 1 (중단)");
                if (bet === 'col3' && winNumber % 3 === 0) matched.push("2 to 1 (상단)");
            }
        });

        const winDisplay = document.getElementById('win-display');
        if (matched.length > 0) {
            winDisplay.textContent = matched.join(', ') + ' 적중';
            winDisplay.style.color = '#0055ff'; // 적중 시 파란색 텍스트
        } else {
            winDisplay.textContent = '맞춘 배팅이 없습니다.';
            winDisplay.style.color = '#000000';
        }
    }

    // 초기화
    initBoard();
    drawWheel();
</script>
</body>
</html>
