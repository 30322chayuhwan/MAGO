<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roulette</title>
    <style>
        body {
            font-family: sans-serif;
            background-color: #ffffff;
            color: #000000;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            height: 100vh;
            box-sizing: border-box;
        }
        .container {
            display: flex;
            gap: 40px;
            max-width: 1200px;
            width: 100%;
        }
        .left-panel, .right-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .wheel-box {
            position: relative;
            width: 400px;
            height: 400px;
            margin-bottom: 20px;
        }
        #wheel {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            transition: transform 5s cubic-bezier(0.25, 0.1, 0.2, 1);
        }
        #ball-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            transition: transform 5s cubic-bezier(0.25, 0.1, 0.2, 1);
        }
        #ball {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            width: 14px;
            height: 14px;
            background-color: #ffffff;
            border-radius: 50%;
            box-shadow: 0 0 5px rgba(0,0,0,0.6);
        }
        button {
            padding: 12px 50px;
            font-size: 18px;
            background-color: #333;
            color: #fff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover { background-color: #555; }
        button:disabled { background-color: #999; cursor: not-allowed; }
        
        .info-box {
            margin-top: 20px;
            width: 100%;
            background: #f0f0f0;
            padding: 15px;
            border-radius: 5px;
            text-align: center;
            border: 1px solid #ddd;
        }
        
        /* 족보 (배팅 보드) 스타일 */
        .board {
            display: grid;
            grid-template-columns: 50px repeat(12, 1fr) 60px;
            grid-template-rows: repeat(5, 45px);
            gap: 2px;
            width: 100%;
            background: #ccc;
            border: 2px solid #ccc;
            position: relative; /* 칩 배치를 위한 기준점 */
        }
        .cell {
            background: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            user-select: none;
            box-sizing: border-box;
            position: relative; /* 칩 배치 기준 */
        }
        .cell:hover { opacity: 0.85; }
        
        /* 색상 클래스 */
        .red { background-color: #d90000; color: white; }
        .black { background-color: #222222; color: white; }
        .green { background-color: #008000; color: white; }
        .special { background-color: #eaeaea; color: #333; }

        /* 카지노 칩 스타일 */
        @keyframes placeChip {
            0% { transform: translate(-50%, -50%) scale(1.5); opacity: 0; }
            100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
        }
        .chip {
            position: absolute;
            width: 26px;
            height: 26px;
            background-color: #0055ff; /* 칩 기본 색상 (파란색) */
            border: 3px dashed #ffffff;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 3px 6px rgba(0,0,0,0.5), inset 0 0 0 3px #0055ff;
            pointer-events: none; /* 클릭을 방해하지 않음 */
            z-index: 10;
            animation: placeChip 0.2s ease-out;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="left-panel">
        <div class="wheel-box">
            <canvas id="wheel" width="400" height="400"></canvas>
            <div id="ball-container">
                <div id="ball"></div>
            </div>
        </div>
        <button id="spin-btn">스핀</button>
        
        <div class="info-box">
            <h3 style="margin:0 0 10px 0;">결과</h3>
            <div id="result-display" style="font-size: 24px; font-weight: bold;">-</div>
        </div>
    </div>

    <div class="right-panel">
        <div class="board" id="board">
            <!-- 자바스크립트로 족보 생성 -->
        </div>

        <div class="info-box">
            <h3 style="margin:0 0 10px 0;">맞춘 배팅</h3>
            <div id="win-display" style="font-weight: bold;">-</div>
        </div>
    </div>
</div>

<script>
    const sequence = [0, 32, 15, 19, 4, 21, 2, 25, 17, 34, 6, 27, 13, 36, 11, 30, 8, 23, 10, 5, 24, 16, 33, 1, 20, 14, 31, 9, 22, 18, 29, 7, 28, 12, 35, 3, 26];
    const redNumbers = [1, 3, 5, 7, 9, 12, 14, 16, 18, 19, 21, 23, 25, 27, 30, 32, 34, 36];
    
    let placedBets = new Map(); // 현재 올려진 칩들의 정보 저장
    let totalWheelRotation = 0;
    let isSpinning = false;

    // 1. 배팅 보드 생성
    function initBoard() {
        const board = document.getElementById('board');
        
        function createCell(text, betId, gridArea, colorClass, type, desc) {
            const cell = document.createElement('div');
            cell.className = `cell ${colorClass}`;
            cell.style.gridArea = gridArea;
            cell.textContent = text;
            
            // 외부 배팅(아웃사이드)과 0은 개별 클릭 이벤트 적용
            cell.addEventListener('click', () => toggleOutsideBet(cell, betId, desc));
            board.appendChild(cell);
        }

        // 0 구역
        createCell('0', '0', '1 / 1 / 4 / 2', 'green', 'outside', '숫자 0');

        // 1~36 숫자 구역 (시각적 렌더링용)
        const rows = [
            [3,6,9,12,15,18,21,24,27,30,33,36],
            [2,5,8,11,14,17,20,23,26,29,32,35],
            [1,4,7,10,13,16,19,22,25,28,31,34]
        ];
        rows.forEach((row, rowIndex) => {
            row.forEach((num, colIndex) => {
                const color = redNumbers.includes(num) ? 'red' : 'black';
                const cell = document.createElement('div');
                cell.className = `cell ${color}`;
                cell.style.gridArea = `${rowIndex + 1} / ${colIndex + 2} / ${rowIndex + 2} / ${colIndex + 3}`;
                cell.textContent = num;
                board.appendChild(cell);
            });
        });

        // 1~36 숫자 구역 위에 '투명한 오버레이'를 덮어서 격자선(스플릿, 코너) 클릭을 감지함
        const overlay = document.createElement('div');
        overlay.id = 'number-overlay';
        overlay.style.gridArea = '1 / 2 / 4 / 14';
        overlay.style.position = 'relative';
        overlay.style.zIndex = '5';
        overlay.style.cursor = 'pointer';
        overlay.addEventListener('click', handleGridClick);
        board.appendChild(overlay);

        // 아웃사이드 배팅 구역
        createCell('2 to 1', 'col3', '1 / 14 / 2 / 15', 'special', 'outside', '2 to 1 (상단)');
        createCell('2 to 1', 'col2', '2 / 14 / 3 / 15', 'special', 'outside', '2 to 1 (중단)');
        createCell('2 to 1', 'col1', '3 / 14 / 4 / 15', 'special', 'outside', '2 to 1 (하단)');
        createCell('1st 12', '1st12', '4 / 2 / 5 / 6', 'special', 'outside', '1st 12 (1~12)');
        createCell('2nd 12', '2nd12', '4 / 6 / 5 / 10', 'special', 'outside', '2nd 12 (13~24)');
        createCell('3rd 12', '3rd12', '4 / 10 / 5 / 14', 'special', 'outside', '3rd 12 (25~36)');
        createCell('1 to 18', '1-18', '5 / 2 / 6 / 4', 'special', 'outside', '1 to 18');
        createCell('Even', 'even', '5 / 4 / 6 / 6', 'special', 'outside', '짝수 (Even)');
        createCell('Red', 'red', '5 / 6 / 6 / 8', 'red', 'outside', 'Red');
        createCell('Black', 'black', '5 / 8 / 6 / 10', 'black', 'outside', 'Black');
        createCell('Odd', 'odd', '5 / 10 / 6 / 12', 'special', 'outside', '홀수 (Odd)');
        createCell('19 to 36', '19-36', '5 / 12 / 6 / 14', 'special', 'outside', '19 to 36');
    }

    // 2. 외부 배팅(아웃사이드, 0) 칩 놓기/빼기
    function toggleOutsideBet(cell, betId, desc) {
        if (isSpinning) return;
        if (placedBets.has(betId)) {
            placedBets.get(betId).element.remove();
            placedBets.delete(betId);
        } else {
            const chip = document.createElement('div');
            chip.className = 'chip';
            chip.style.left = '50%';
            chip.style.top = '50%';
            cell.appendChild(chip);

            placedBets.set(betId, { element: chip, type: 'outside', betId: betId, desc: desc });
        }
    }

    // 3. 1~36 구역 내부 격자선 클릭 감지 및 칩 놓기
    function handleGridClick(e) {
        if (isSpinning) return;
        
        const rect = e.target.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;
        const cellW = rect.width / 12;
        const cellH = rect.height / 3;

        // 클릭된 좌표가 몇 번째 줄/칸인지 계산
        const col = Math.floor(x / cellW);
        const row = Math.floor(y / cellH);
        
        // 클릭 위치가 가장 가까운 세로선/가로선 구하기
        const lineC = Math.round(x / cellW);
        const lineR = Math.round(y / cellH);
        
        // 선까지의 거리(픽셀)
        const distX = Math.abs(x - lineC * cellW);
        const distY = Math.abs(y - lineR * cellH);
        const tolerance = 15; // 15픽셀 이내면 선을 클릭한 것으로 간주

        let betType, cx, cy, betId, nums;

        // 숫자 계산 도우미 함수 (r=0,1,2 / c=0~11)
        const getNum = (r, c) => (c + 1) * 3 - r;

        if (distX <= tolerance && distY <= tolerance && lineC > 0 && lineC < 12 && lineR > 0 && lineR < 3) {
            // 코너 (네 모서리가 만나는 십자가 지점)
            betType = 'corner';
            cx = lineC * cellW; cy = lineR * cellH;
            betId = `corner_${lineR}_${lineC}`;
            nums = [getNum(lineR-1, lineC-1), getNum(lineR, lineC-1), getNum(lineR-1, lineC), getNum(lineR, lineC)].sort((a,b)=>a-b);
        } else if (distX <= tolerance && lineC > 0 && lineC < 12) {
            // 스플릿 (세로선)
            betType = 'split';
            cx = lineC * cellW; cy = (row + 0.5) * cellH;
            betId = `vsplit_${row}_${lineC}`;
            nums = [getNum(row, lineC-1), getNum(row, lineC)].sort((a,b)=>a-b);
        } else if (distY <= tolerance && lineR > 0 && lineR < 3) {
            // 스플릿 (가로선)
            betType = 'split';
            cx = (col + 0.5) * cellW; cy = lineR * cellH;
            betId = `hsplit_${lineR}_${col}`;
            nums = [getNum(lineR-1, col), getNum(lineR, col)].sort((a,b)=>a-b);
        } else {
            // 스트레이트 업 (숫자 중앙)
            betType = 'straight';
            cx = (col + 0.5) * cellW; cy = (row + 0.5) * cellH;
            betId = `straight_${row}_${col}`;
            nums = [getNum(row, col)];
        }

        // 칩 토글 로직
        if (placedBets.has(betId)) {
            placedBets.get(betId).element.remove();
            placedBets.delete(betId);
        } else {
            const chip = document.createElement('div');
            chip.className = 'chip';
            chip.style.left = `${cx}px`;
            chip.style.top = `${cy}px`;
            e.target.appendChild(chip); // 오버레이 위에 칩 부착

            let desc = '';
            if (betType === 'straight') desc = `숫자 ${nums[0]}`;
            if (betType === 'split') desc = `스플릿 (${nums.join(', ')})`;
            if (betType === 'corner') desc = `코너 (${nums.join(', ')})`;

            placedBets.set(betId, { element: chip, type: 'inside', numbers: nums, desc: desc });
        }
    }

    // 4. 룰렛 휠 디자인 (중앙 노란색 적용)
    function drawWheel() {
        const canvas = document.getElementById('wheel');
        const ctx = canvas.getContext('2d');
        const center = canvas.width / 2;
        const arc = 2 * Math.PI / sequence.length;

        ctx.translate(center, center);

        // 바깥 공 트랙
        ctx.beginPath();
        ctx.arc(0, 0, 195, 0, Math.PI * 2);
        ctx.fillStyle = '#e0e0e0';
        ctx.fill();
        ctx.lineWidth = 10;
        ctx.strokeStyle = '#cccccc';
        ctx.stroke();

        // 룰렛 칸 그리기
        for (let i = 0; i < sequence.length; i++) {
            const num = sequence[i];
            const angle = i * arc;
            
            if (num === 0) ctx.fillStyle = '#008000';
            else if (redNumbers.includes(num)) ctx.fillStyle = '#d90000';
            else ctx.fillStyle = '#222222';

            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.arc(0, 0, 170, angle - arc/2 - Math.PI/2, angle + arc/2 - Math.PI/2);
            ctx.fill();

            // 숫자 텍스트
            ctx.save();
            ctx.fillStyle = "white";
            ctx.font = "bold 16px sans-serif";
            ctx.rotate(angle - Math.PI/2);
            ctx.textAlign = "right";
            ctx.fillText(num, 155, 6);
            ctx.restore();
        }

        // 중앙 기둥 장식 (부드러운 노란색으로 변경)
        ctx.beginPath();
        ctx.arc(0, 0, 70, 0, Math.PI * 2);
        ctx.fillStyle = '#ffeaa7'; // 너무 진하지 않은 부드러운 노란색
        ctx.fill();
        ctx.lineWidth = 5;
        ctx.strokeStyle = '#e1b12c'; // 테두리는 살짝 진한 골드톤
        ctx.stroke();
    }

    // 5. 스핀 및 공 굴리기
    document.getElementById('spin-btn').addEventListener('click', () => {
        if (isSpinning) return;
        isSpinning = true;
        document.getElementById('spin-btn').disabled = true;
        document.getElementById('result-display').textContent = '회전 중...';
        document.getElementById('win-display').textContent = '-';
        document.getElementById('win-display').style.color = '#000';

        const wheel = document.getElementById('wheel');
        const ballContainer = document.getElementById('ball-container');
        const ball = document.getElementById('ball');

        ball.style.transition = 'none';
        ball.style.top = '15px'; 
        ball.offsetHeight;

        const winIndex = Math.floor(Math.random() * sequence.length);
        const winNumber = sequence[winIndex];
        
        const spinDegree = (360 * 5) + Math.floor(Math.random() * 360);
        totalWheelRotation += spinDegree;
        const pocketAngle = winIndex * (360 / sequence.length);
        const finalBallRotation = totalWheelRotation + pocketAngle - (360 * 8);

        wheel.style.transform = `rotate(${totalWheelRotation}deg)`;
        ballContainer.style.transform = `rotate(${finalBallRotation}deg)`;
        
        setTimeout(() => {
            ball.style.transition = 'top 1.5s cubic-bezier(0.2, 0.8, 0.4, 1)';
            ball.style.top = '55px'; 
        }, 3500);

        setTimeout(() => {
            checkResult(winNumber);
            isSpinning = false;
            document.getElementById('spin-btn').disabled = false;
        }, 5000);
    });

    // 6. 결과 판독 로직
    function checkResult(winNumber) {
        const isRed = redNumbers.includes(winNumber);
        const colorText = winNumber === 0 ? "Green" : (isRed ? "Red" : "Black");
        
        document.getElementById('result-display').textContent = `${winNumber} (${colorText})`;
        
        let matched = [];
        
        // 맵에 저장된 모든 칩을 순회하며 당첨 여부 확인
        placedBets.forEach(bet => {
            if (bet.type === 'inside') {
                // 스플릿, 코너, 단일 숫자에 당첨 숫자가 포함되어 있는지 체크
                if (bet.numbers.includes(winNumber)) {
                    matched.push(bet.desc);
                }
            } else if (bet.type === 'outside') {
                const id = bet.betId;
                if (id === '0' && winNumber === 0) matched.push(bet.desc);
                if (winNumber !== 0) {
                    if (id === 'red' && isRed) matched.push(bet.desc);
                    if (id === 'black' && !isRed) matched.push(bet.desc);
                    if (id === 'even' && winNumber % 2 === 0) matched.push(bet.desc);
                    if (id === 'odd' && winNumber % 2 !== 0) matched.push(bet.desc);
                    if (id === '1-18' && winNumber >= 1 && winNumber <= 18) matched.push(bet.desc);
                    if (id === '19-36' && winNumber >= 19 && winNumber <= 36) matched.push(bet.desc);
                    if (id === '1st12' && winNumber >= 1 && winNumber <= 12) matched.push(bet.desc);
                    if (id === '2nd12' && winNumber >= 13 && winNumber <= 24) matched.push(bet.desc);
                    if (id === '3rd12' && winNumber >= 25 && winNumber <= 36) matched.push(bet.desc);
                    if (id === 'col1' && winNumber % 3 === 1) matched.push(bet.desc);
                    if (id === 'col2' && winNumber % 3 === 2) matched.push(bet.desc);
                    if (id === 'col3' && winNumber % 3 === 0) matched.push(bet.desc);
                }
            }
        });

        const winDisplay = document.getElementById('win-display');
        if (matched.length > 0) {
            winDisplay.innerHTML = matched.join('<br>') + '<br><span style="color:#0055ff;">적중</span>';
        } else {
            winDisplay.textContent = '맞춘 배팅이 없습니다.';
        }
    }

    // 초기화
    initBoard();
    drawWheel();
</script>
</body>
</html>
