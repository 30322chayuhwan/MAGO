<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roulette</title>
    <style>
        body {
            font-family: sans-serif;
            background-color: #ffffff;
            color: #000000;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .container {
            display: flex;
            gap: 50px;
            max-width: 1400px;
            width: 100%;
        }
        .left-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 450px;
        }
        .right-panel {
            flex: 2;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .wheel-box {
            position: relative;
            width: 400px;
            height: 400px;
            margin-bottom: 20px;
        }
        #wheel {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            transition: transform 5s cubic-bezier(0.25, 0.1, 0.2, 1);
        }
        #ball-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            transition: transform 5s cubic-bezier(0.25, 0.1, 0.2, 1);
        }
        #ball {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            width: 14px;
            height: 14px;
            background-color: #ffffff;
            border-radius: 50%;
            box-shadow: 0 0 5px rgba(0,0,0,0.6);
        }
        button {
            padding: 15px 60px;
            font-size: 20px;
            background-color: #333;
            color: #fff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover { background-color: #555; }
        button:disabled { background-color: #999; cursor: not-allowed; }
        
        .info-box {
            margin-top: 20px;
            width: 100%;
            background: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            border: 2px solid #e9ecef;
            box-sizing: border-box;
        }
        
        /* 족보 (배팅 보드) 스타일 - 크기 및 간격 확장 */
        .board {
            display: grid;
            grid-template-columns: 80px repeat(12, 1fr) 80px;
            grid-template-rows: repeat(5, 70px); /* 높이 증가 */
            gap: 10px; /* 격자선 히트박스와 정확히 일치하는 크기 */
            width: 100%;
            background: #888888; /* 격자선 배경색 */
            border: 4px solid #888888;
            border-radius: 8px;
            position: relative;
        }
        .cell {
            background: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            font-size: 18px; /* 글씨 크기 증가 */
            cursor: pointer;
            user-select: none;
            box-sizing: border-box;
            position: relative;
            transition: transform 0.1s;
        }
        .cell:hover { opacity: 0.9; }
        
        /* 외부 배팅 호버 및 마우스 올렸을 때 숫자 색상 변경 */
        .cell.hover-active {
            background-color: #ffeaa7 !important;
            color: #000 !important;
            box-shadow: inset 0 0 0 4px #e1b12c !important;
            opacity: 1 !important;
            z-index: 2;
        }
        
        /* 색상 클래스 */
        .red { background-color: #d90000; color: white; }
        .black { background-color: #222222; color: white; }
        .green { background-color: #008000; color: white; }
        .special { background-color: #eaeaea; color: #333; }

        /* 카지노 칩 스타일 (조금 더 크게) */
        @keyframes placeChip {
            0% { transform: translate(-50%, -50%) scale(1.5); opacity: 0; }
            100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
        }
        .chip {
            position: absolute;
            width: 32px;
            height: 32px;
            background-color: #0055ff; 
            border: 4px dashed #ffffff;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 4px 8px rgba(0,0,0,0.5), inset 0 0 0 4px #0055ff;
            pointer-events: none; 
            z-index: 10;
            animation: placeChip 0.2s ease-out;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="left-panel">
        <div class="wheel-box">
            <canvas id="wheel" width="400" height="400"></canvas>
            <div id="ball-container">
                <div id="ball"></div>
            </div>
        </div>
        <button id="spin-btn">스핀</button>
        
        <div class="info-box">
            <h3 style="margin:0 0 10px 0;">결과</h3>
            <div id="result-display" style="font-size: 26px; font-weight: bold;">-</div>
        </div>
    </div>

    <div class="right-panel">
        <div class="board" id="board">
            </div>

        <div class="info-box">
            <h3 style="margin:0 0 10px 0;">맞춘 배팅 및 배당</h3>
            <div id="win-display" style="font-size: 18px; line-height: 1.5; font-weight: bold;">-</div>
        </div>
    </div>
</div>

<script>
    const sequence = [0, 32, 15, 19, 4, 21, 2, 25, 17, 34, 6, 27, 13, 36, 11, 30, 8, 23, 10, 5, 24, 16, 33, 1, 20, 14, 31, 9, 22, 18, 29, 7, 28, 12, 35, 3, 26];
    const redNumbers = [1, 3, 5, 7, 9, 12, 14, 16, 18, 19, 21, 23, 25, 27, 30, 32, 34, 36];
    
    let placedBets = new Map();
    let totalWheelRotation = 0;
    let isSpinning = false;

    // 1. 배팅 보드 생성
    function initBoard() {
        const board = document.getElementById('board');
        
        function createCell(text, betId, gridArea, colorClass, type, desc, mult) {
            const cell = document.createElement('div');
            cell.className = `cell ${colorClass}`;
            cell.style.gridArea = gridArea;
            cell.textContent = text;
            
            // 외부 배팅(아웃사이드)과 0은 개별 클릭 이벤트 적용
            cell.addEventListener('click', () => toggleOutsideBet(cell, betId, desc, mult));
            // 0 전용 호버 효과
            if (betId === '0') {
                cell.addEventListener('mouseenter', () => cell.classList.add('hover-active'));
                cell.addEventListener('mouseleave', () => cell.classList.remove('hover-active'));
            }
            board.appendChild(cell);
        }

        // 0 구역
        createCell('0', '0', '1 / 1 / 4 / 2', 'green', 'outside', '숫자 0', 36);

        // 1~36 숫자 구역 생성 (아이디 부여)
        const rows = [
            [3,6,9,12,15,18,21,24,27,30,33,36],
            [2,5,8,11,14,17,20,23,26,29,32,35],
            [1,4,7,10,13,16,19,22,25,28,31,34]
        ];
        rows.forEach((row, rowIndex) => {
            row.forEach((num, colIndex) => {
                const color = redNumbers.includes(num) ? 'red' : 'black';
                const cell = document.createElement('div');
                cell.className = `cell ${color}`;
                cell.id = `cell-${num}`; // 하이라이트 제어를 위한 ID
                cell.style.gridArea = `${rowIndex + 1} / ${colIndex + 2} / ${rowIndex + 2} / ${colIndex + 3}`;
                cell.textContent = num;
                board.appendChild(cell);
            });
        });

        // 숫자 구역 전용 투명 오버레이 (마우스 움직임 및 클릭 추적)
        const overlay = document.createElement('div');
        overlay.id = 'number-overlay';
        overlay.style.gridArea = '1 / 2 / 4 / 14';
        overlay.style.position = 'relative';
        overlay.style.zIndex = '5';
        overlay.style.cursor = 'pointer';
        
        overlay.addEventListener('mousemove', (e) => handleOverlayEvent(e, false));
        overlay.addEventListener('click', (e) => handleOverlayEvent(e, true));
        overlay.addEventListener('mouseleave', clearHighlights);
        board.appendChild(overlay);

        // 아웃사이드 배팅 구역
        createCell('2 to 1', 'col3', '1 / 14 / 2 / 15', 'special', 'outside', '2 to 1 (상단)', 3);
        createCell('2 to 1', 'col2', '2 / 14 / 3 / 15', 'special', 'outside', '2 to 1 (중단)', 3);
        createCell('2 to 1', 'col1', '3 / 14 / 4 / 15', 'special', 'outside', '2 to 1 (하단)', 3);
        
        createCell('1st 12', '1st12', '4 / 2 / 5 / 6', 'special', 'outside', '1st 12', 3);
        createCell('2nd 12', '2nd12', '4 / 6 / 5 / 10', 'special', 'outside', '2nd 12', 3);
        createCell('3rd 12', '3rd12', '4 / 10 / 5 / 14', 'special', 'outside', '3rd 12', 3);
        
        createCell('1 to 18', '1-18', '5 / 2 / 6 / 4', 'special', 'outside', '1 to 18', 2);
        createCell('Even', 'even', '5 / 4 / 6 / 6', 'special', 'outside', '짝수 (Even)', 2);
        createCell('Red', 'red', '5 / 6 / 6 / 8', 'red', 'outside', 'Red', 2);
        createCell('Black', 'black', '5 / 8 / 6 / 10', 'black', 'outside', 'Black', 2);
        createCell('Odd', 'odd', '5 / 10 / 6 / 12', 'special', 'outside', '홀수 (Odd)', 2);
        createCell('19 to 36', '19-36', '5 / 12 / 6 / 14', 'special', 'outside', '19 to 36', 2);
    }

    // 외부 배팅 처리
    function toggleOutsideBet(cell, betId, desc, mult) {
        if (isSpinning) return;
        if (placedBets.has(betId)) {
            placedBets.get(betId).element.remove();
            placedBets.delete(betId);
        } else {
            const chip = document.createElement('div');
            chip.className = 'chip';
            chip.style.left = '50%';
            chip.style.top = '50%';
            cell.appendChild(chip);

            placedBets.set(betId, { element: chip, type: 'outside', betId: betId, desc: desc, mult: mult });
        }
    }

    // 숫자를 구하는 헬퍼 함수
    const getNum = (row, col) => (col + 1) * 3 - row;
    let currentHoverId = null;

    // 1~36구역의 움직임 및 클릭 이벤트 (정확한 Gap 크기 기반 히트박스)
    function handleOverlayEvent(e, isClick) {
        if (isSpinning) return;
        
        const overlay = e.currentTarget;
        const rect = overlay.getBoundingClientRect();
        
        // CSS 상의 gap 크기 (10px)와 동일하게 맵핑
        const gap = 10; 
        const cellW = (rect.width - 11 * gap) / 12;
        const cellH = (rect.height - 2 * gap) / 3;

        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;

        // 마우스가 위치한 열(0~11)과 행(0~2)을 수식으로 완벽히 추출
        let col = Math.floor(x / (cellW + gap));
        let row = Math.floor(y / (cellH + gap));
        
        // 경계선 보정
        if(col < 0) col = 0; if(col > 11) col = 11;
        if(row < 0) row = 0; if(row > 2) row = 2;

        // 해당 칸 내에서의 로컬 좌표
        const localX = x - (col * (cellW + gap));
        const localY = y - (row * (cellH + gap));

        // 로컬 좌표가 실제 칸 너비를 넘어서면 무조건 Gap(격자선) 위에 있는 것임
        let inGapX = localX > cellW;
        let inGapY = localY > cellH;

        // 가장자리 바깥 예외 처리
        if (col === 11) inGapX = false;
        if (row === 2) inGapY = false;

        let betType, betId, nums, cx, cy, mult;

        if (inGapX && inGapY) {
            // 코너 배팅 (모서리)
            betType = 'corner';
            betId = `corner_${row}_${col}`;
            nums = [getNum(row, col), getNum(row+1, col), getNum(row, col+1), getNum(row+1, col+1)].sort((a,b)=>a-b);
            cx = (col * (cellW + gap)) + cellW + (gap / 2);
            cy = (row * (cellH + gap)) + cellH + (gap / 2);
            mult = 9;
        } else if (inGapX) {
            // 스플릿 배팅 (세로 선)
            betType = 'split';
            betId = `vsplit_${row}_${col}`;
            nums = [getNum(row, col), getNum(row, col+1)].sort((a,b)=>a-b);
            cx = (col * (cellW + gap)) + cellW + (gap / 2);
            cy = (row * (cellH + gap)) + (cellH / 2);
            mult = 18;
        } else if (inGapY) {
            // 스플릿 배팅 (가로 선)
            betType = 'split';
            betId = `hsplit_${row}_${col}`;
            nums = [getNum(row, col), getNum(row+1, col)].sort((a,b)=>a-b);
            cx = (col * (cellW + gap)) + (cellW / 2);
            cy = (row * (cellH + gap)) + cellH + (gap / 2);
            mult = 18;
        } else {
            // 단일 숫자 (칸 중앙)
            betType = 'straight';
            betId = `straight_${row}_${col}`;
            nums = [getNum(row, col)];
            cx = (col * (cellW + gap)) + (cellW / 2);
            cy = (row * (cellH + gap)) + (cellH / 2);
            mult = 36;
        }

        // 마우스 호버 시 대상 숫자들에 시각적 효과 (노란색 하이라이트)
        if (isClick && currentHoverId !== betId) {
            clearHighlights();
            nums.forEach(n => {
                const cell = document.getElementById(`cell-${n}`);
                if (cell) cell.classList.add('hover-active');
            });
            currentHoverId = betId;
        }

        // 클릭 시 칩 놓기/빼기
        if (isClick) {
            if (placedBets.has(betId)) {
                placedBets.get(betId).element.remove();
                placedBets.delete(betId);
            } else {
                const chip = document.createElement('div');
                chip.className = 'chip';
                chip.style.left = `${cx}px`;
                chip.style.top = `${cy}px`;
                overlay.appendChild(chip);

                let desc = '';
                if (betType === 'straight') desc = `숫자 ${nums[0]}`;
                if (betType === 'split') desc = `스플릿 (${nums.join(', ')})`;
                if (betType === 'corner') desc = `코너 (${nums.join(', ')})`;

                placedBets.set(betId, { element: chip, type: 'inside', numbers: nums, desc: desc, mult: mult });
            }
        }
    }

    function clearHighlights() {
        document.querySelectorAll('.cell.hover-active').forEach(el => el.classList.remove('hover-active'));
        currentHoverId = null;
    }

    // 룰렛 휠 디자인
    function drawWheel() {
        const canvas = document.getElementById('wheel');
        const ctx = canvas.getContext('2d');
        const center = canvas.width / 2;
        const arc = 2 * Math.PI / sequence.length;

        ctx.translate(center, center);

        ctx.beginPath();
        ctx.arc(0, 0, 195, 0, Math.PI * 2);
        ctx.fillStyle = '#e0e0e0';
        ctx.fill();
        ctx.lineWidth = 10;
        ctx.strokeStyle = '#cccccc';
        ctx.stroke();

        for (let i = 0; i < sequence.length; i++) {
            const num = sequence[i];
            const angle = i * arc;
            
            if (num === 0) ctx.fillStyle = '#008000';
            else if (redNumbers.includes(num)) ctx.fillStyle = '#d90000';
            else ctx.fillStyle = '#222222';

            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.arc(0, 0, 170, angle - arc/2 - Math.PI/2, angle + arc/2 - Math.PI/2);
            ctx.fill();

            ctx.save();
            ctx.fillStyle = "white";
            ctx.font = "bold 16px sans-serif";
            ctx.rotate(angle - Math.PI/2);
            ctx.textAlign = "right";
            ctx.fillText(num, 155, 6);
            ctx.restore();
        }

        ctx.beginPath();
        ctx.arc(0, 0, 70, 0, Math.PI * 2);
        ctx.fillStyle = '#ffeaa7';
        ctx.fill();
        ctx.lineWidth = 5;
        ctx.strokeStyle = '#e1b12c';
        ctx.stroke();
    }

    // 스핀 및 결과 확인
    document.getElementById('spin-btn').addEventListener('click', () => {
        if (isSpinning) return;
        isSpinning = true;
        document.getElementById('spin-btn').disabled = true;
        document.getElementById('result-display').textContent = '회전 중...';
        document.getElementById('win-display').textContent = '-';

        const wheel = document.getElementById('wheel');
        const ballContainer = document.getElementById('ball-container');
        const ball = document.getElementById('ball');

        ball.style.transition = 'none';
        ball.style.top = '15px'; 
        ball.offsetHeight;

        const winIndex = Math.floor(Math.random() * sequence.length);
        const winNumber = sequence[winIndex];
        
        const spinDegree = (360 * 5) + Math.floor(Math.random() * 360);
        totalWheelRotation += spinDegree;
        const pocketAngle = winIndex * (360 / sequence.length);
        const finalBallRotation = totalWheelRotation + pocketAngle - (360 * 8);

        wheel.style.transform = `rotate(${totalWheelRotation}deg)`;
        ballContainer.style.transform = `rotate(${finalBallRotation}deg)`;
        
        setTimeout(() => {
            ball.style.transition = 'top 1.5s cubic-bezier(0.2, 0.8, 0.4, 1)';
            ball.style.top = '55px'; 
        }, 3500);

        setTimeout(() => {
            checkResult(winNumber);
            isSpinning = false;
            document.getElementById('spin-btn').disabled = false;
        }, 5000);
    });

    function checkResult(winNumber) {
        const isRed = redNumbers.includes(winNumber);
        const colorText = winNumber === 0 ? "Green" : (isRed ? "Red" : "Black");
        
        document.getElementById('result-display').textContent = `${winNumber} (${colorText})`;
        
        let matched = [];
        let totalWinMessage = "";
        
        placedBets.forEach(bet => {
            if (bet.type === 'inside' && bet.numbers.includes(winNumber)) {
                matched.push(`• ${bet.desc} <span style="color:#0055ff;">(${bet.mult}배)</span>`);
            } else if (bet.type === 'outside') {
                const id = bet.betId;
                if (id === '0' && winNumber === 0) matched.push(`• ${bet.desc} <span style="color:#0055ff;">(${bet.mult}배)</span>`);
                if (winNumber !== 0) {
                    if (id === 'red' && isRed) matched.push(`• ${bet.desc} <span style="color:#0055ff;">(${bet.mult}배)</span>`);
                    if (id === 'black' && !isRed) matched.push(`• ${bet.desc} <span style="color:#0055ff;">(${bet.mult}배)</span>`);
                    if (id === 'even' && winNumber % 2 === 0) matched.push(`• ${bet.desc} <span style="color:#0055ff;">(${bet.mult}배)</span>`);
                    if (id === 'odd' && winNumber % 2 !== 0) matched.push(`• ${bet.desc} <span style="color:#0055ff;">(${bet.mult}배)</span>`);
                    if (id === '1-18' && winNumber >= 1 && winNumber <= 18) matched.push(`• ${bet.desc} <span style="color:#0055ff;">(${bet.mult}배)</span>`);
                    if (id === '19-36' && winNumber >= 19 && winNumber <= 36) matched.push(`• ${bet.desc} <span style="color:#0055ff;">(${bet.mult}배)</span>`);
                    if (id === '1st12' && winNumber >= 1 && winNumber <= 12) matched.push(`• ${bet.desc} <span style="color:#0055ff;">(${bet.mult}배)</span>`);
                    if (id === '2nd12' && winNumber >= 13 && winNumber <= 24) matched.push(`• ${bet.desc} <span style="color:#0055ff;">(${bet.mult}배)</span>`);
                    if (id === '3rd12' && winNumber >= 25 && winNumber <= 36) matched.push(`• ${bet.desc} <span style="color:#0055ff;">(${bet.mult}배)</span>`);
                    if (id === 'col1' && winNumber % 3 === 1) matched.push(`• ${bet.desc} <span style="color:#0055ff;">(${bet.mult}배)</span>`);
                    if (id === 'col2' && winNumber % 3 === 2) matched.push(`• ${bet.desc} <span style="color:#0055ff;">(${bet.mult}배)</span>`);
                    if (id === 'col3' && winNumber % 3 === 0) matched.push(`• ${bet.desc} <span style="color:#0055ff;">(${bet.mult}배)</span>`);
                }
            }
        });

        const winDisplay = document.getElementById('win-display');
        if (matched.length > 0) {
            winDisplay.innerHTML = matched.join('<br>') + '<br><br><span style="color:#d90000; font-size: 22px;">적중</span>';
        } else {
            winDisplay.textContent = '맞춘 배팅이 없습니다.';
        }
    }

    initBoard();
    drawWheel();
</script>
</body>
</html>
